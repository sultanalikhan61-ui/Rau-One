<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Slime vs Collector</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #1a1a24; color: #fff; font-family: sans-serif; text-align: center; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #lobby { position: absolute; z-index: 10; background: rgba(26,26,36,0.95); width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; padding: 20px; }
        input, button { padding: 12px 20px; font-size: 16px; border-radius: 8px; border: none; outline: none; }
        button { background: #ff4757; color: white; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; }
        input { text-align: center; width: 200px; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        canvas { background: #2f3542; border: 3px solid #ff4757; border-radius: 12px; max-width: 95vw; max-height: 70vh; touch-action: none; }
        #ui { position: absolute; top: 15px; font-size: 18px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px; z-index: 5; }
        /* Виртуальный джойстик */
        #joystick-zone { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); touch-action: none; display: flex; justify-content: center; align-items: center; }
        #joystick-knob { width: 50px; height: 50px; background: #ff4757; border-radius: 50%; position: absolute; }
    </style>
</head>
<body>

    <div id="lobby">
        <h2>Slime Quest 💖</h2>
        <p id="peer-status">Подключение к сети...</p>
        <div style="display:flex; gap:10px;">
            <button id="btn-host" onclick="createRoom()">Создать (Я Слайм)</button>
        </div>
        <hr style="width: 200px; border-color: #444;">
        <div>
            <input type="text" id="room-input" placeholder="Код комнаты">
            <button onclick="joinRoom()">Войти (Я Искатель)</button>
        </div>
    </div>

    <div id="game-container">
        <div id="ui">Собрано сердечек: <span id="score">0</span> / 10</div>
        <canvas id="canvas" width="600" height="600"></canvas>
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    let peer = null;
    let conn = null;
    let isHost = false;
    let myId = '';

    // Игровые объекты
    let player = { x: 100, y: 100, radius: 15, color: '#2ed573', speed: 4 }; // Искатель (Она)
    let slime = { x: 500, y: 500, radius: 20, color: '#ff4757', speed: 3.5 };  // Слайм (Ты)
    let hearts = [];
    let score = 0;
    let keys = {};
    let inputVector = { x: 0, y: 0 };

    // Инициализация PeerJS
    function initPeer() {
        // Генерация короткого кода комнаты из 4 цифр
        const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
        peer = new Peer(roomCode);

        peer.on('open', (id) => {
            myId = id;
            document.getElementById('peer-status').innerText = 'Ваш код комнаты: ' + id;
        });

        peer.on('connection', (c) => {
            conn = c;
            setupConnection();
        });

        peer.on('error', (err) => {
            alert('Ошибка сети: ' + err.type);
        });
    }

    function createRoom() {
        isHost = true;
        document.getElementById('peer-status').innerText = 'Ждем подключения Искателя... Код: ' + myId;
        document.getElementById('btn-host').disabled = true;
    }

    function joinRoom() {
        const code = document.getElementById('room-input').value.trim();
        if (!code) return alert('Введите код!');
        isHost = false;
        conn = peer.connect(code);
        setupConnection();
    }

    function setupConnection() {
        conn.on('open', () => {
            document.getElementById('lobby').style.display = 'none';
            if (isHost) {
                spawnHearts();
                gameLoop();
            } else {
                gameLoop();
            }
        });

        conn.on('data', (data) => {
            if (isHost) {
                // Хост (Слайм) получает координаты Искателя
                if (data.type === 'player_move') {
                    player.x = data.x;
                    player.y = data.y;
                }
            } else {
                // Клиент (Искатель) получает состояние игры от Хоста
                if (data.type === 'state') {
                    slime.x = data.slime.x;
                    slime.y = data.slime.y;
                    hearts = data.hearts;
                    score = data.score;
                    scoreEl.innerText = score;
                }
            }
        });
    }

    function spawnHearts() {
        hearts = [];
        for (let i = 0; i < 10; i++) {
            hearts.push({
                x: 30 + Math.random() * (canvas.width - 60),
                y: 30 + Math.random() * (canvas.height - 60),
                collected: false
            });
        }
    }

    // Джойстик управления
    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');
    let joyActive = false;

    joyZone.addEventListener('touchstart', handleTouch);
    joyZone.addEventListener('touchmove', handleTouch);
    joyZone.addEventListener('touchend', () => {
        joyActive = false;
        joyKnob.style.transform = `translate(0px, 0px)`;
        inputVector = { x: 0, y: 0 };
    });

    function handleTouch(e) {
        e.preventDefault();
        const rect = joyZone.getBoundingClientRect();
        const touch = e.touches[0];
        const dx = touch.clientX - (rect.left + rect.width / 2);
        const dy = touch.clientY - (rect.top + rect.height / 2);
        const dist = Math.min(Math.hypot(dx, dy), 45);
        const angle = Math.atan2(dy, dx);

        const joyX = Math.cos(angle) * dist;
        const joyY = Math.sin(angle) * dist;

        joyKnob.style.transform = `translate(${joyX}px, ${joyY}px)`;
        inputVector = { x: Math.cos(angle) * (dist / 45), y: Math.sin(angle) * (dist / 45) };
    }

    // Клавиатура для ПК
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    function update() {
        let dx = inputVector.x;
        let dy = inputVector.y;

        if (keys['ArrowLeft'] || keys['a']) dx = -1;
        if (keys['ArrowRight'] || keys['d']) dx = 1;
        if (keys['ArrowUp'] || keys['w']) dy = -1;
        if (keys['ArrowDown'] || keys['s']) dy = 1;

        if (isHost) {
            // Движение Слайма (Тебя)
            slime.x += dx * slime.speed;
            slime.y += dy * slime.speed;
            slime.x = Math.max(slime.radius, Math.min(canvas.width - slime.radius, slime.x));
            slime.y = Math.max(slime.radius, Math.min(canvas.height - slime.radius, slime.y));

            // Проверка столкновения Слайма и Искателя (помеха)
            const distToPlayer = Math.hypot(slime.x - player.x, slime.y - player.y);
            if (distToPlayer < slime.radius + player.radius) {
                if (score > 0) score--; // Отнимаем очко за касание
                // Отталкивание
                player.x += (player.x - slime.x) * 0.5;
                player.y += (player.y - slime.y) * 0.5;
            }

            // Отправка состояния Клиенту
            if (conn && conn.open) {
                conn.send({
                    type: 'state',
                    slime: { x: slime.x, y: slime.y },
                    hearts: hearts,
                    score: score
                });
            }
        } else {
            // Движение Искателя (Её)
            player.x += dx * player.speed;
            player.y += dy * player.speed;
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // Проверка сбора сердечек
            hearts.forEach(h => {
                if (!h.collected && Math.hypot(player.x - h.x, player.y - h.y) < player.radius + 10) {
                    h.collected = true;
                    score++;
                }
            });

            // Отправка координат Хосту
            if (conn && conn.open) {
                conn.send({
                    type: 'player_move',
                    x: player.x,
                    y: player.y
                });
            }
        }

        scoreEl.innerText = score;
        if (score >= 10) {
            setTimeout(() => alert(isHost ? 'Она собрала все сердечки и победила! ❤️' : 'Ура! Ты собрала все сердечки! ❤️'), 100);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Отрисовка сердечек
        hearts.forEach(h => {
            if (!h.collected) {
                ctx.fillStyle = '#ff6b81';
                ctx.beginPath();
                ctx.arc(h.x, h.y, 8, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        // Отрисовка Искателя (Зеленый круг)
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();

        // Отрисовка Слайма (Красный круг)
        ctx.fillStyle = slime.color;
        ctx.beginPath();
        ctx.arc(slime.x, slime.y, slime.radius, 0, Math.PI * 2);
        ctx.fill();
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    initPeer();
</script>
</body>
</html>
